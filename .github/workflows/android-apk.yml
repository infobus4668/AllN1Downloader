name: Build and smoke-test Android APK
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - app.py
      - requirements.txt
      - static/**
      - android/**
      - .github/workflows/android-apk.yml
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Android release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo 'Release tags require the ANDROID_KEYSTORE_BASE64 signing secret.' >&2
              exit 1
            fi
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore="$RUNNER_TEMP/alln1downloader-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo 'configured=true' >> "$GITHUB_OUTPUT"
      - name: Install Android build and emulator packages
        run: |
          build_tools=$(cat android/build-tools-version.txt)
          ndk_version=$(cat android/ndk-version.txt)
          sdkmanager --install 'platforms/android-37.0' "build-tools/$build_tools" "ndk/$ndk_version" 'emulator' 'system-images/android-36/google_apis/x86_64'
      - name: Build, lint and package debug APK
        run: bash android/gradlew -p android --no-daemon assembleDebug assembleDebugAndroidTest lintDebug -PchaquopyBuildPython=python
      - uses: actions/upload-artifact@v4
        with:
          name: alln1downloader-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash android/gradlew -p android --no-daemon connectedDebugAndroidTest -PchaquopyBuildPython=python
      - name: Build and verify signed release APK/AAB
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash android/gradlew -p android --no-daemon assembleRelease bundleRelease -PsignRelease=true -PchaquopyBuildPython=python
          build_tools=$(cat android/build-tools-version.txt)
          "$ANDROID_HOME/build-tools/$build_tools/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          name: alln1downloader-android-signed-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
